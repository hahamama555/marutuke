<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>マス目ツール</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  padding: 0;
  background: #ffffff;
  color: #222;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Helvetica Neue",
    "Hiragino Kaku Gothic ProN",
    "Yu Gothic",
    Meiryo,
    sans-serif;
}

body {
  padding-bottom: 80px;
}

/* =========================
   全体
========================= */

.container {
  width: 100%;
  max-width: 900px;
  margin: 0 auto;
  padding: 14px;
}

/* =========================
   タイトル
========================= */

.title {
  text-align: center;
  font-size: 28px;
  font-weight: 800;
  margin: 8px 0 18px;
  word-break: break-word;
}

/* =========================
   操作パネル
========================= */

.controls {
  background: #f3f3f3;
  border-radius: 14px;
  padding: 14px;
  margin-bottom: 18px;
}

.control-row {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 10px;
}

.control-row:last-child {
  margin-bottom: 0;
}

.control-item {
  flex: 1;
  min-width: 120px;
}

.control-item label {
  display: block;
  font-size: 13px;
  font-weight: bold;
  margin-bottom: 5px;
}

input,
textarea {
  width: 100%;
  border: 2px solid #ccc;
  border-radius: 9px;
  background: white;
  padding: 10px;
  font-size: 16px;
  outline: none;
}

input:focus,
textarea:focus {
  border-color: #4a90e2;
}

button {
  border: none;
  border-radius: 10px;
  padding: 11px 15px;
  font-size: 15px;
  font-weight: bold;
  background: #333;
  color: white;
  cursor: pointer;
  touch-action: manipulation;
}

button:active {
  transform: scale(0.97);
}

.blue-button {
  background: #2196f3;
}

.red-button {
  background: #e53935;
}

.gray-button {
  background: #666;
}

/* =========================
   マス
========================= */

.grid {
  display: grid;
  gap: 7px;
  width: 100%;
}

/*
  画面幅に応じて5列
*/
.grid {
  grid-template-columns: repeat(5, minmax(0, 1fr));
}

/* =========================
   個別マス
========================= */

.cell {
  position: relative;

  background: #87CEEB;

  border: 3px solid #777;
  border-radius: 10px;

  min-height: 105px;

  display: flex;
  align-items: center;
  justify-content: center;

  overflow: hidden;

  cursor: pointer;
  user-select: none;

  transition:
    background-color 0.15s ease,
    transform 0.08s ease;
}

.cell:active {
  transform: scale(0.96);
}

/* =========================
   マス名称
========================= */

.cell-name {
  position: absolute;

  top: 10px;
  left: 3px;
  right: 3px;

  text-align: center;

  color: #222;

  font-size: 18px;
  line-height: 1.25;
  font-weight: 800;

  word-break: break-all;

  z-index: 5;
}

/* =========================
   タップ後
========================= */

.cell.checked {
  background: #e53935;
}

/*
  タップ後の大きな⭕️
*/
.cell.checked::after {
  content: "⭕";

  position: absolute;

  left: 50%;
  top: 64%;

  transform: translate(-50%, -50%);

  font-size: 58px;

  line-height: 1;

  z-index: 2;

  pointer-events: none;
}

/* =========================
   マスが少ない場合
========================= */

.grid.small .cell {
  min-height: 120px;
}

.grid.small .cell-name {
  font-size: 21px;
}

/* =========================
   マスが多い場合
========================= */

.grid.large {
  gap: 5px;
}

.grid.large .cell {
  min-height: 80px;
  border-width: 2px;
}

.grid.large .cell-name {
  font-size: 14px;
}

.grid.large .cell.checked::after {
  font-size: 42px;
}

/* =========================
   モーダル
========================= */

.modal-background {
  display: none;

  position: fixed;

  inset: 0;

  background: rgba(0,0,0,0.55);

  z-index: 1000;

  padding: 20px;

  align-items: center;
  justify-content: center;
}

.modal-background.show {
  display: flex;
}

.modal {
  width: 100%;
  max-width: 600px;

  max-height: 90vh;

  background: white;

  border-radius: 16px;

  padding: 18px;

  overflow-y: auto;
}

.modal h2 {
  margin: 0 0 8px;
  font-size: 21px;
}

.modal p {
  margin: 0 0 12px;
  font-size: 14px;
  color: #555;
}

#namesInput {
  min-height: 300px;
  resize: vertical;

  font-size: 16px;
  line-height: 1.7;
}

.modal-buttons {
  display: flex;
  gap: 8px;
  margin-top: 12px;
}

.modal-buttons button {
  flex: 1;
}

/* =========================
   スマホ
========================= */

@media (max-width: 600px) {

  .container {
    padding: 10px;
  }

  .title {
    font-size: 23px;
    margin-bottom: 13px;
  }

  .controls {
    padding: 10px;
  }

  .grid {
    gap: 5px;
  }

  .cell {
    min-height: 92px;
    border-width: 2px;
    border-radius: 8px;
  }

  .cell-name {
    font-size: 15px;
    top: 8px;
  }

  .cell.checked::after {
    font-size: 48px;
    top: 65%;
  }
}

/* =========================
   さらに小さいスマホ
========================= */

@media (max-width: 390px) {

  .cell {
    min-height: 82px;
  }

  .cell-name {
    font-size: 14px;
  }

  .cell.checked::after {
    font-size: 43px;
  }

  .grid {
    gap: 4px;
  }
}

/* =========================
   1〜4マス
========================= */

.grid.one-column {
  grid-template-columns: repeat(1, 1fr);
}

.grid.two-columns {
  grid-template-columns: repeat(2, 1fr);
}

.grid.three-columns {
  grid-template-columns: repeat(3, 1fr);
}

.grid.four-columns {
  grid-template-columns: repeat(4, 1fr);
}
</style>
</head>

<body>

<div class="container">

  <!-- タイトル -->
  <div id="title" class="title">
    47都道府県制覇！
  </div>


  <!-- =========================
       操作パネル
  ========================== -->

  <div class="controls">

    <div class="control-row">

      <div class="control-item">
        <label>タイトル</label>

        <input
          id="titleInput"
          type="text"
          value="47都道府県制覇！"
        >
      </div>

      <div class="control-item" style="max-width:130px;">
        <label>マス数</label>

        <input
          id="countInput"
          type="number"
          min="1"
          max="200"
          value="47"
        >
      </div>

    </div>


    <div class="control-row">

      <button
        class="blue-button"
        onclick="changeTitle()">
        タイトル変更
      </button>

      <button
        class="blue-button"
        onclick="openNamesEditor()">
        マス名称を変更
      </button>

      <button
        class="red-button"
        onclick="createGrid()">
        マス数を変更
      </button>

      <button
        class="gray-button"
        onclick="resetAll()">
        リセット
      </button>

    </div>

  </div>


  <!-- =========================
       マス
  ========================== -->

  <div id="grid" class="grid"></div>

</div>


<!-- =========================
     マス名称編集モーダル
========================== -->

<div
  id="modalBackground"
  class="modal-background">

  <div class="modal">

    <h2>マス名称を変更</h2>

    <p>
      1行に1つずつ入力してください。<br>
      上から順番にマスへ入ります。
    </p>

    <textarea
      id="namesInput"
      placeholder="北海道
青森県
岩手県
宮城県
秋田県">
    </textarea>

    <div class="modal-buttons">

      <button
        class="gray-button"
        onclick="closeNamesEditor()">
        キャンセル
      </button>

      <button
        class="blue-button"
        onclick="saveNames()">
        変更する
      </button>

    </div>

  </div>

</div>


<script>

/* ========================================
   初期データ
======================================== */

const defaultNames = [
  "北海道",
  "青森県",
  "岩手県",
  "宮城県",
  "秋田県",
  "山形県",
  "福島県",
  "茨城県",
  "栃木県",
  "群馬県",
  "埼玉県",
  "千葉県",
  "東京都",
  "神奈川県",
  "新潟県",
  "富山県",
  "石川県",
  "福井県",
  "山梨県",
  "長野県",
  "岐阜県",
  "静岡県",
  "愛知県",
  "三重県",
  "滋賀県",
  "京都府",
  "大阪府",
  "兵庫県",
  "奈良県",
  "和歌山県",
  "鳥取県",
  "島根県",
  "岡山県",
  "広島県",
  "山口県",
  "徳島県",
  "香川県",
  "愛媛県",
  "高知県",
  "福岡県",
  "佐賀県",
  "長崎県",
  "熊本県",
  "大分県",
  "宮崎県",
  "鹿児島県",
  "沖縄県"
];


/* ========================================
   現在の名称
======================================== */

let names = [...defaultNames];


/* ========================================
   初期表示
======================================== */

window.addEventListener("DOMContentLoaded", function() {

  createGrid();

});


/* ========================================
   タイトル変更
======================================== */

function changeTitle() {

  const input =
    document.getElementById("titleInput");

  const title =
    document.getElementById("title");

  let value =
    input.value.trim();

  if (value === "") {

    value = "マス目ツール";

    input.value = value;

  }

  title.textContent = value;

}


/* ========================================
   マス作成
======================================== */

function createGrid() {

  const countInput =
    document.getElementById("countInput");

  let count =
    parseInt(countInput.value, 10);


  /* 1〜200に制限 */

  if (isNaN(count)) {
    count = 47;
  }

  if (count < 1) {
    count = 1;
  }

  if (count > 200) {
    count = 200;
  }

  countInput.value = count;


  const grid =
    document.getElementById("grid");


  /* いったん全部削除 */

  grid.innerHTML = "";


  /* 列数を調整 */

  grid.className = "grid";


  if (count === 1) {

    grid.classList.add("one-column");

  } else if (count <= 4) {

    grid.classList.add("two-columns");

  }


  if (count <= 10) {

    grid.classList.add("small");

  }


  if (count >= 100) {

    grid.classList.add("large");

  }


  /* ====================================
     マスを作る
  ==================================== */

  for (let i = 0; i < count; i++) {

    const cell =
      document.createElement("div");

    cell.className = "cell";


    /* 名称 */

    const name =
      document.createElement("div");

    name.className = "cell-name";


    if (names[i]) {

      name.textContent = names[i];

    } else {

      name.textContent =
        "マス" + (i + 1);

    }


    cell.appendChild(name);


    /* ==================================
       タップで⭕️
    ================================== */

    cell.addEventListener("click", function() {

      cell.classList.toggle("checked");

    });


    grid.appendChild(cell);

  }

}


/* ========================================
   名称編集を開く
======================================== */

function openNamesEditor() {

  const modal =
    document.getElementById("modalBackground");

  const textarea =
    document.getElementById("namesInput");


  const count =
    parseInt(
      document.getElementById("countInput").value,
      10
    );


  let text = "";


  for (let i = 0; i < count; i++) {

    if (names[i]) {

      text += names[i];

    } else {

      text += "マス" + (i + 1);

    }


    if (i < count - 1) {

      text += "\n";

    }

  }


  textarea.value = text;


  modal.classList.add("show");

}


/* ========================================
   名称編集を閉じる
======================================== */

function closeNamesEditor() {

  document
    .getElementById("modalBackground")
    .classList.remove("show");

}


/* ========================================
   名称を保存
======================================== */

function saveNames() {

  const textarea =
    document.getElementById("namesInput");


  const lines =
    textarea.value
      .split("\n")
      .map(function(item) {

        return item.trim();

      });


  names = lines;


  createGrid();

  closeNamesEditor();

}


/* ========================================
   全リセット
======================================== */

function resetAll() {

  const ok =
    confirm(
      "タイトル・マス数・名称・⭕️を初期状態に戻しますか？"
    );


  if (!ok) {
    return;
  }


  document.getElementById("titleInput").value =
    "47都道府県制覇！";


  document.getElementById("countInput").value =
    "47";


  document.getElementById("title").textContent =
    "47都道府県制覇！";


  names = [...defaultNames];


  createGrid();

}


/* ========================================
   モーダル外をタップして閉じる
======================================== */

document
  .getElementById("modalBackground")
  .addEventListener("click", function(e) {

    if (e.target === this) {

      closeNamesEditor();

    }

  });

</script>

</body>
</html>
