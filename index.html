<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>マス企画</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  background: white;
  font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue",
               "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
}

/* 全体 */
.container {
  width: 100%;
  max-width: 900px;
  margin: 0 auto;
  padding: 15px 10px 50px;
}

/* タイトル */
h1 {
  text-align: center;
  font-size: 28px;
  margin: 5px 0 15px;
}

/* 設定エリア */
.settings {
  background: #f5f5f5;
  border-radius: 12px;
  padding: 12px;
  margin-bottom: 15px;
}

.settings label {
  display: block;
  font-weight: bold;
  margin-bottom: 5px;
}

.settings input {
  width: 100%;
  padding: 10px;
  margin-bottom: 10px;
  font-size: 16px;
  border: 1px solid #ccc;
  border-radius: 8px;
}

/* ボタン */
button {
  border: none;
  border-radius: 8px;
  padding: 10px 15px;
  font-size: 16px;
  cursor: pointer;
  touch-action: manipulation;
}

.create-btn {
  background: #333;
  color: white;
  width: 100%;
}

/* マス */
.board {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 6px;
  background: white;
}

/*
  マス本体
  position: relative にして
  ⭕️と文字を重ねる
*/
.cell {
  position: relative;
  aspect-ratio: 1 / 1;
  background: #9edff0;
  border: 3px solid #777;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;

  /* タップできるようにする */
  cursor: pointer;
  touch-action: manipulation;
}

/* ⭕️
   文字より下のレイヤー */
.circle {
  position: absolute;

  /* ⭕️を大きく */
  width: 88%;
  height: 88%;

  border: 8px solid red;
  border-radius: 50%;

  left: 6%;
  top: 6%;

  z-index: 1;

  /* クリックを邪魔しない */
  pointer-events: none;

  display: none;
}

/* タップ後 */
.cell.active {
  background: #ff0000;
}

/* ⭕️を表示 */
.cell.active .circle {
  display: block;
}

/*
  マスの名称
  ⭕️より上のレイヤー
*/
.cell-name {
  position: relative;
  z-index: 2;

  color: #222;
  font-size: clamp(12px, 3.5vw, 24px);
  font-weight: bold;
  text-align: center;

  /* 文字を⭕️の上に表示 */
  pointer-events: none;

  padding: 4px;
  line-height: 1.2;
}

/*
  赤くなった後の文字
  白文字
*/
.cell.active .cell-name {
  color: white;
}

/* スマホ */
@media (max-width: 600px) {

  .container {
    padding-left: 6px;
    padding-right: 6px;
    padding-bottom: 60px;
  }

  h1 {
    font-size: 22px;
  }

  .board {
    gap: 5px;
  }

  .cell {
    border-width: 2px;
    border-radius: 8px;
  }

  .circle {
    border-width: 6px;
  }

  .cell-name {
    font-size: clamp(11px, 3.7vw, 20px);
  }
}
</style>
</head>

<body>

<div class="container">

  <h1 id="title">47都道府県制覇！</h1>

  <!-- 設定 -->
  <div class="settings">

    <label>タイトル</label>
    <input
      id="titleInput"
      type="text"
      value="47都道府県制覇！"
    >

    <label>マス数（1〜200）</label>
    <input
      id="countInput"
      type="number"
      min="1"
      max="200"
      value="47"
    >

    <button class="create-btn" onclick="createBoard()">
      マスを作る
    </button>

  </div>

  <!-- マス -->
  <div id="board" class="board"></div>

</div>

<script>

/* 初期名称 */
const defaultNames = [
  "北海道",
  "青森県",
  "岩手県",
  "宮城県",
  "秋田県",
  "山形県",
  "福島県",
  "茨城県",
  "栃木県",
  "群馬県",
  "埼玉県",
  "千葉県",
  "東京都",
  "神奈川県",
  "新潟県",
  "富山県",
  "石川県",
  "福井県",
  "山梨県",
  "長野県",
  "岐阜県",
  "静岡県",
  "愛知県",
  "三重県",
  "滋賀県",
  "京都府",
  "大阪府",
  "兵庫県",
  "奈良県",
  "和歌山県",
  "鳥取県",
  "島根県",
  "岡山県",
  "広島県",
  "山口県",
  "徳島県",
  "香川県",
  "愛媛県",
  "高知県",
  "福岡県",
  "佐賀県",
  "長崎県",
  "熊本県",
  "大分県",
  "宮崎県",
  "鹿児島県",
  "沖縄県"
];


/* マスを作成 */
function createBoard() {

  const board = document.getElementById("board");
  const title = document.getElementById("title");

  const count =
    parseInt(document.getElementById("countInput").value) || 47;

  const titleText =
    document.getElementById("titleInput").value || "マス企画";

  /* タイトル変更 */
  title.textContent = titleText;

  /* マスを一旦削除 */
  board.innerHTML = "";

  /* 1〜200に制限 */
  const total = Math.max(1, Math.min(200, count));

  for (let i = 0; i < total; i++) {

    const cell = document.createElement("div");
    cell.className = "cell";

    /*
      ⭕️
      z-index 1
    */
    const circle = document.createElement("div");
    circle.className = "circle";

    /*
      文字
      z-index 2
    */
    const name = document.createElement("div");
    name.className = "cell-name";

    if (i < defaultNames.length) {
      name.textContent = defaultNames[i];
    } else {
      name.textContent = "マス" + (i + 1);
    }

    /*
      ⭕️ → 文字
      の順番で入れる
    */
    cell.appendChild(circle);
    cell.appendChild(name);

    /*
      タップすると赤＋⭕️
    */
    cell.addEventListener("click", function() {
      cell.classList.toggle("active");
    });

    board.appendChild(cell);
  }
}


/* 最初に47マス表示 */
createBoard();

</script>

</body>
</html>
