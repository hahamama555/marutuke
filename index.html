<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>マス企画</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  background: white;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Helvetica Neue",
    "Hiragino Kaku Gothic ProN",
    "Yu Gothic",
    sans-serif;
}

/* 全体 */
.container {
  width: 100%;
  max-width: 900px;
  margin: 0 auto;
  padding: 15px 8px 70px;
}

/* タイトル */
h1 {
  text-align: center;
  font-size: 28px;
  margin: 5px 0 15px;
}

/* 設定部分 */
.settings {
  background: #f5f5f5;
  border-radius: 12px;
  padding: 12px;
  margin-bottom: 15px;
}

.settings label {
  display: block;
  font-weight: bold;
  margin-bottom: 5px;
}

.settings input {
  width: 100%;
  padding: 10px;
  margin-bottom: 10px;
  font-size: 16px;
  border: 1px solid #ccc;
  border-radius: 8px;
}

.create-btn {
  width: 100%;
  padding: 12px;
  background: #333;
  color: white;
  border: none;
  border-radius: 8px;
  font-size: 16px;
  font-weight: bold;
}

/* マス */
.board {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 6px;
}

/* 1マス */
.cell {
  position: relative;

  aspect-ratio: 1 / 1;

  background: #9edff0;

  border: 3px solid #777;
  border-radius: 10px;

  display: flex;
  align-items: center;
  justify-content: center;

  overflow: hidden;

  cursor: pointer;
  touch-action: manipulation;
}

/*
========================================
タップ後のマス
========================================
*/
.cell.active {
  background: white;
}

/*
========================================
⭕️
========================================

マス全体に重ねる。

文字より下のレイヤー。
*/
.circle {
  position: absolute;

  width: 88%;
  height: 88%;

  left: 6%;
  top: 6%;

  border: 8px solid red;
  border-radius: 50%;

  display: none;

  z-index: 1;

  pointer-events: none;
}

/* タップ後だけ⭕️表示 */
.cell.active .circle {
  display: block;
}

/*
========================================
マス名称
========================================

⭕️より前面。

これによって

⭕️
北海道

ではなく

北海道
⭕️

のように「文字が⭕️の向こう側」に見える。
*/
.cell-name {
  position: relative;

  z-index: 2;

  color: #222;

  font-size: clamp(
    12px,
    3.5vw,
    24px
  );

  font-weight: bold;

  text-align: center;

  line-height: 1.2;

  padding: 4px;

  pointer-events: none;
}

/* タップ後は白文字 */
.cell.active .cell-name {
  color: #222;
}

/* スマホ */
@media (max-width: 600px) {

  .container {
    padding-left: 5px;
    padding-right: 5px;
    padding-bottom: 70px;
  }

  h1 {
    font-size: 22px;
  }

  .board {
    gap: 5px;
  }

  .cell {
    border-width: 2px;
    border-radius: 8px;
  }

  .circle {
    border-width: 6px;
  }

  .cell-name {
    font-size: clamp(
      11px,
      3.7vw,
      20px
    );
  }
}
</style>
</head>

<body>

<div class="container">

  <h1 id="title">
    47都道府県制覇！
  </h1>

  <!-- 設定 -->
  <div class="settings">

    <label>タイトル</label>

    <input
      id="titleInput"
      type="text"
      value="47都道府県制覇！"
    >

    <label>マス数（1〜200）</label>

    <input
      id="countInput"
      type="number"
      min="1"
      max="200"
      value="47"
    >

    <button
      class="create-btn"
      onclick="createBoard()"
    >
      マスを作る
    </button>

  </div>

  <!-- マス -->
  <div
    id="board"
    class="board"
  ></div>

</div>

<script>

/* 47都道府県 */
const defaultNames = [

  "北海道",
  "青森県",
  "岩手県",
  "宮城県",
  "秋田県",

  "山形県",
  "福島県",
  "茨城県",
  "栃木県",
  "群馬県",

  "埼玉県",
  "千葉県",
  "東京都",
  "神奈川県",
  "新潟県",

  "富山県",
  "石川県",
  "福井県",
  "山梨県",
  "長野県",

  "岐阜県",
  "静岡県",
  "愛知県",
  "三重県",
  "滋賀県",

  "京都府",
  "大阪府",
  "兵庫県",
  "奈良県",
  "和歌山県",

  "鳥取県",
  "島根県",
  "岡山県",
  "広島県",
  "山口県",

  "徳島県",
  "香川県",
  "愛媛県",
  "高知県",
  "福岡県",

  "佐賀県",
  "長崎県",
  "熊本県",
  "大分県",
  "宮崎県",

  "鹿児島県",
  "沖縄県"

];


/* マス作成 */
function createBoard() {

  const board =
    document.getElementById("board");

  const title =
    document.getElementById("title");

  const titleInput =
    document.getElementById("titleInput");

  const countInput =
    document.getElementById("countInput");


  /* タイトル */
  title.textContent =
    titleInput.value || "マス企画";


  /* マス数 */
  let count =
    parseInt(countInput.value);

  if (!count || count < 1) {
    count = 1;
  }

  if (count > 200) {
    count = 200;
  }


  /* 既存マス削除 */
  board.innerHTML = "";


  /* マス生成 */
  for (let i = 0; i < count; i++) {

    const cell =
      document.createElement("div");

    cell.className = "cell";


    /*
    ⭕️
    */
    const circle =
      document.createElement("div");

    circle.className = "circle";


    /*
    マス名称
    */
    const name =
      document.createElement("div");

    name.className = "cell-name";


    /* 47都道府県 */
    if (i < defaultNames.length) {

      name.textContent =
        defaultNames[i];

    } else {

      name.textContent =
        "マス" + (i + 1);

    }


    /*
    ⭕️を先に入れる
    ↓
    文字を後に入れる

    z-indexで文字が前面。
    */
    cell.appendChild(circle);
    cell.appendChild(name);


    /*
    タップ処理
    */
    cell.addEventListener(
      "click",
      function() {

        cell.classList.toggle("active");

      }
    );


    board.appendChild(cell);
  }
}


/* 最初に47マス表示 */
createBoard();

</script>

</body>
</html>
