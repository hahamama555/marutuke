<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<title>マス目参加型ツール</title>

<style>

/* =========================================
   基本
========================================= */

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  padding: 0;
  background: #ffffff;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Helvetica Neue",
    "Hiragino Kaku Gothic ProN",
    "Yu Gothic",
    Meiryo,
    sans-serif;

  color: #222222;
}

body {
  padding-bottom: 70px;
}


/* =========================================
   全体
========================================= */

.container {
  width: 100%;
  max-width: 1000px;

  margin: 0 auto;

  padding:
    10px 8px 70px;
}


/* =========================================
   タイトル
========================================= */

#title {
  margin:
    5px 0 15px;

  text-align: center;

  font-size:
    clamp(22px, 6vw, 40px);

  font-weight: 800;

  line-height: 1.2;

  word-break: break-word;
}


/* =========================================
   設定パネル
========================================= */

.settings {
  width: 100%;

  background: #f3f3f3;

  border-radius: 14px;

  padding: 13px;

  margin-bottom: 15px;
}


/* =========================================
   入力
========================================= */

.input-group {
  margin-bottom: 12px;
}

.input-group:last-child {
  margin-bottom: 0;
}

.input-group label {
  display: block;

  margin-bottom: 5px;

  font-size: 14px;

  font-weight: bold;
}

.input-group input {
  width: 100%;

  height: 44px;

  padding:
    8px 10px;

  background: #ffffff;

  border:
    2px solid #cccccc;

  border-radius: 8px;

  font-size: 16px;

  outline: none;
}

.input-group input:focus {
  border-color: #2196f3;
}


/* =========================================
   ボタン
========================================= */

.button-row {
  display: grid;

  grid-template-columns:
    repeat(2, 1fr);

  gap: 7px;

  margin-top: 10px;
}

button {
  min-height: 44px;

  padding:
    9px 8px;

  border: none;

  border-radius: 9px;

  font-size: 14px;

  font-weight: bold;

  color: white;

  cursor: pointer;

  touch-action: manipulation;
}

button:active {
  transform: scale(0.97);
}

.blue {
  background: #2196f3;
}

.green {
  background: #009688;
}

.red {
  background: #e53935;
}

.gray {
  background: #666666;
}


/* =========================================
   説明
========================================= */

.help {
  margin:
    8px 0 12px;

  text-align: center;

  color: #666666;

  font-size: 13px;

  line-height: 1.5;
}


/* =========================================
   マス
========================================= */

#board {
  width: 100%;

  display: grid;

  grid-template-columns:
    repeat(5, minmax(0, 1fr));

  gap: 6px;
}


/* =========================================
   1マス
========================================= */

.cell {
  position: relative;

  width: 100%;

  aspect-ratio: 1 / 1;

  min-width: 0;

  background: #9edff0;

  border:
    3px solid #777777;

  border-radius: 10px;

  display: flex;

  align-items: center;

  justify-content: center;

  overflow: hidden;

  cursor: pointer;

  user-select: none;

  -webkit-user-select: none;

  touch-action: manipulation;

  transition:
    background-color 0.15s ease,
    transform 0.08s ease;
}

.cell:active {
  transform: scale(0.96);
}


/* =========================================
   マス名称
   ⭕️より前面
========================================= */

.cell-name {
  position: relative;

  z-index: 5;

  width: 100%;

  padding:
    5px 3px;

  color: #222222;

  text-align: center;

  font-size:
    clamp(11px, 3.5vw, 23px);

  font-weight: 800;

  line-height: 1.2;

  word-break: break-all;

  overflow-wrap: anywhere;

  pointer-events: none;
}


/* =========================================
   タップ後のマス
========================================= */

.cell.checked {
  background: #ffffff;
}


/* =========================================
   赤い⭕️
   ★マス全体に重ねる
   ★文字より後ろ
========================================= */

.cell-circle {
  position: absolute;

  z-index: 2;

  width: 88%;

  height: 88%;

  left: 6%;

  top: 6%;

  border:
    8px solid #ff0000;

  border-radius: 50%;

  display: none;

  pointer-events: none;
}


/* =========================================
   チェック済みなら⭕️表示
========================================= */

.cell.checked .cell-circle {
  display: block;
}


/* =========================================
   200マスなど大量表示
========================================= */

#board.large {
  gap: 4px;
}

#board.large .cell {
  border-width: 2px;

  border-radius: 6px;
}

#board.large .cell-name {
  font-size:
    clamp(7px, 2vw, 13px);
}

#board.large .cell-circle {
  border-width: 5px;
}


/* =========================================
   名称設定モーダル
========================================= */

#nameModal {
  position: fixed;

  inset: 0;

  z-index: 1000;

  display: none;

  align-items: center;

  justify-content: center;

  padding: 15px;

  background:
    rgba(0, 0, 0, 0.55);
}

#nameModal.show {
  display: flex;
}


/* =========================================
   モーダル本体
========================================= */

.modal-box {
  width: 100%;

  max-width: 600px;

  max-height: 90vh;

  overflow-y: auto;

  background: #ffffff;

  border-radius: 15px;

  padding: 17px;
}

.modal-box h2 {
  margin:
    0 0 6px;

  font-size: 21px;
}

.modal-box p {
  margin:
    0 0 12px;

  color: #666666;

  font-size: 13px;

  line-height: 1.5;
}


/* =========================================
   マス名称入力一覧
========================================= */

.name-list {
  display: flex;

  flex-direction: column;

  gap: 7px;
}


/* 1行 */
.name-row {
  display: flex;

  align-items: center;

  gap: 7px;
}

.name-number {
  width: 38px;

  flex: 0 0 38px;

  text-align: right;

  font-size: 13px;

  font-weight: bold;

  color: #555555;
}

.name-row input {
  flex: 1;

  min-width: 0;

  height: 42px;

  padding:
    7px 9px;

  border:
    1px solid #cccccc;

  border-radius: 7px;

  font-size: 15px;

  outline: none;
}

.name-row input:focus {
  border-color: #2196f3;
}


/* =========================================
   モーダルボタン
========================================= */

.modal-buttons {
  display: grid;

  grid-template-columns:
    repeat(2, 1fr);

  gap: 7px;

  margin-top: 13px;
}


/* =========================================
   スマホ
========================================= */

@media (max-width: 600px) {

  .container {
    padding:
      6px 5px 70px;
  }

  .settings {
    padding: 10px;
  }

  #board {
    gap: 5px;
  }

  .cell {
    border-width: 2px;

    border-radius: 8px;
  }

  .cell-circle {
    border-width: 6px;
  }

  .cell-name {
    font-size:
      clamp(10px, 3.6vw, 19px);
  }
}


/* =========================================
   小さいスマホ
========================================= */

@media (max-width: 390px) {

  #board {
    gap: 4px;
  }

  .cell {
    border-radius: 7px;
  }

  .cell-circle {
    border-width: 5px;
  }

  .cell-name {
    font-size:
      clamp(9px, 3.5vw, 16px);
  }

}


/* =========================================
   1〜4マス
========================================= */

#board.one {
  grid-template-columns:
    repeat(1, 1fr);
}

#board.two {
  grid-template-columns:
    repeat(2, 1fr);
}

#board.three {
  grid-template-columns:
    repeat(3, 1fr);
}

#board.four {
  grid-template-columns:
    repeat(4, 1fr);
}

</style>
</head>


<body>

<div class="container">


  <!-- =====================================
       タイトル
  ====================================== -->

  <h1 id="title">
    47都道府県制覇！
  </h1>


  <!-- =====================================
       設定
  ====================================== -->

  <div class="settings">

    <!-- タイトル -->

    <div class="input-group">

      <label>
        タイトル
      </label>

      <input
        id="titleInput"
        type="text"
        value="47都道府県制覇！"
      >

    </div>


    <!-- マス数 -->

    <div class="input-group">

      <label>
        マス数（1〜200）
      </label>

      <input
        id="countInput"
        type="number"
        min="1"
        max="200"
        value="47"
      >

    </div>


    <!-- ボタン -->

    <div class="button-row">

      <button
        class="blue"
        id="createButton">
        マスを作る
      </button>

      <button
        class="green"
        id="nameButton">
        マス名称を設定
      </button>

      <button
        class="red"
        id="resetButton">
        ⭕️を全部リセット
      </button>

    </div>

  </div>


  <!-- =====================================
       説明
  ====================================== -->

  <div class="help">

    マスをタップすると
    <strong>白色＋赤い⭕️</strong>になります。<br>

    もう一度タップすると元に戻ります。

  </div>


  <!-- =====================================
       ボード
  ====================================== -->

  <div
    id="board">
  </div>


</div>


<!-- =========================================
     マス名称設定画面
========================================== -->

<div
  id="nameModal">


  <div class="modal-box">

    <h2>
      マス名称を設定
    </h2>

    <p>
      好きな名前を入力してください。<br>
      1つの入力欄が1マスに対応しています。
    </p>


    <!-- 名称一覧 -->

    <div
      id="nameList"
      class="name-list">
    </div>


    <!-- ボタン -->

    <div class="modal-buttons">

      <button
        class="gray"
        id="cancelButton">
        キャンセル
      </button>

      <button
        class="blue"
        id="saveNamesButton">
        名称を保存
      </button>

    </div>


  </div>

</div>


<script>

/* =====================================================
   初期の47都道府県
===================================================== */

const defaultNames = [

  "北海道",
  "青森県",
  "岩手県",
  "宮城県",
  "秋田県",
  "山形県",
  "福島県",

  "茨城県",
  "栃木県",
  "群馬県",
  "埼玉県",
  "千葉県",
  "東京都",
  "神奈川県",

  "新潟県",
  "富山県",
  "石川県",
  "福井県",
  "山梨県",
  "長野県",

  "岐阜県",
  "静岡県",
  "愛知県",
  "三重県",

  "滋賀県",
  "京都府",
  "大阪府",
  "兵庫県",
  "奈良県",
  "和歌山県",

  "鳥取県",
  "島根県",
  "岡山県",
  "広島県",
  "山口県",

  "徳島県",
  "香川県",
  "愛媛県",
  "高知県",

  "福岡県",
  "佐賀県",
  "長崎県",
  "熊本県",
  "大分県",
  "宮崎県",
  "鹿児島県",
  "沖縄県"

];


/* =====================================================
   現在の名称
===================================================== */

let names =
  [...defaultNames];


/* =====================================================
   要素取得
===================================================== */

const board =
  document.getElementById(
    "board"
  );

const title =
  document.getElementById(
    "title"
  );

const titleInput =
  document.getElementById(
    "titleInput"
  );

const countInput =
  document.getElementById(
    "countInput"
  );

const nameModal =
  document.getElementById(
    "nameModal"
  );

const nameList =
  document.getElementById(
    "nameList"
  );


/* =====================================================
   マス数を安全に取得
===================================================== */

function getCount() {

  let count =
    parseInt(
      countInput.value,
      10
    );


  if (
    isNaN(count)
  ) {
    count = 47;
  }


  if (
    count < 1
  ) {
    count = 1;
  }


  if (
    count > 200
  ) {
    count = 200;
  }


  countInput.value =
    count;


  return count;
}


/* =====================================================
   タイトル変更
===================================================== */

function updateTitle() {

  const value =
    titleInput.value.trim();


  title.textContent =
    value ||
    "参加型企画";
}


/* =====================================================
   マス作成
===================================================== */

function createBoard() {

  const count =
    getCount();


  /* タイトル */

  updateTitle();


  /* 既存マス削除 */

  board.innerHTML =
    "";


  /* 列数クラス削除 */

  board.className =
    "";


  board.id =
    "board";


  /* =========================================
     1〜200マスに合わせて列数
  ========================================= */

  if (
    count === 1
  ) {

    board.classList.add(
      "one"
    );

  }

  else if (
    count === 2
  ) {

    board.classList.add(
      "two"
    );

  }

  else if (
    count === 3
  ) {

    board.classList.add(
      "three"
    );

  }

  else if (
    count === 4
  ) {

    board.classList.add(
      "four"
    );

  }

  else if (
    count >= 100
  ) {

    board.classList.add(
      "large"
    );

  }


  /* =========================================
     マス作成
  ========================================= */

  for (
    let i = 0;
    i < count;
    i++
  ) {


    /* マス */

    const cell =
      document.createElement(
        "div"
      );

    cell.className =
      "cell";


    /* =======================================
       ⭕️
       ※文字より後ろ
    ======================================= */

    const circle =
      document.createElement(
        "div"
      );

    circle.className =
      "cell-circle";


    /* =======================================
       マス名称
       ※⭕️より前
    ======================================= */

    const name =
      document.createElement(
        "div"
      );

    name.className =
      "cell-name";


    name.textContent =
      names[i] ||
      "マス" +
      (i + 1);


    /* =======================================
       順番

       ⭕️
       ↓
       マス名称

       z-indexによって
       マス名称が前面になる
    ======================================= */

    cell.appendChild(
      circle
    );

    cell.appendChild(
      name
    );


    /* =======================================
       タップ
    ======================================= */

    cell.addEventListener(
      "click",
      function() {

        cell.classList.toggle(
          "checked"
        );

      }
    );


    board.appendChild(
      cell
    );

  }

}


/* =====================================================
   マス名称設定画面を開く
===================================================== */

function openNameEditor() {

  const count =
    getCount();


  nameList.innerHTML =
    "";


  /* =========================================
     マスごとの入力欄
  ========================================= */

  for (
    let i = 0;
    i < count;
    i++
  ) {

    const row =
      document.createElement(
        "div"
      );

    row.className =
      "name-row";


    /* 番号 */

    const number =
      document.createElement(
        "div"
      );

    number.className =
      "name-number";

    number.textContent =
      (i + 1) +
      "．";


    /* 入力 */

    const input =
      document.createElement(
        "input"
      );

    input.type =
      "text";

    input.value =
      names[i] ||
      "マス" +
      (i + 1);

    input.dataset.index =
      i;


    /* 追加 */

    row.appendChild(
      number
    );

    row.appendChild(
      input
    );

    nameList.appendChild(
      row
    );

  }


  nameModal.classList.add(
    "show"
  );

}


/* =====================================================
   名称を保存
===================================================== */

function saveNames() {

  const inputs =
    nameList.querySelectorAll(
      "input"
    );


  const newNames =
    [];


  inputs.forEach(
    function(input) {

      let value =
        input.value.trim();


      if (
        value === ""
      ) {

        value =
          "マス" +
          (
            parseInt(
              input.dataset.index,
              10
            ) + 1
          );

      }


      newNames.push(
        value
      );

    }
  );


  names =
    newNames;


  /* ボード再表示 */

  createBoard();


  closeNameEditor();

}


/* =====================================================
   名称設定を閉じる
===================================================== */

function closeNameEditor() {

  nameModal.classList.remove(
    "show"
  );

}


/* =====================================================
   ⭕️全部リセット
===================================================== */

function resetChecked() {

  const ok =
    window.confirm(
      "付いている⭕️をすべて消しますか？"
    );


  if (
    !ok
  ) {

    return;

  }


  const checkedCells =
    board.querySelectorAll(
      ".cell.checked"
    );


  checkedCells.forEach(
    function(cell) {

      cell.classList.remove(
        "checked"
      );

    }
  );

}


/* =====================================================
   ボタン
===================================================== */

document
  .getElementById(
    "createButton"
  )
  .addEventListener(
    "click",
    function() {

      createBoard();

    }
  );


document
  .getElementById(
    "nameButton"
  )
  .addEventListener(
    "click",
    function() {

      openNameEditor();

    }
  );


document
  .getElementById(
    "saveNamesButton"
  )
  .addEventListener(
    "click",
    function() {

      saveNames();

    }
  );


document
  .getElementById(
    "cancelButton"
  )
  .addEventListener(
    "click",
    function() {

      closeNameEditor();

    }
  );


document
  .getElementById(
    "resetButton"
  )
  .addEventListener(
    "click",
    function() {

      resetChecked();

    }
  );


/* =====================================================
   タイトルを入力したら即反映
===================================================== */

titleInput.addEventListener(
  "input",
  function() {

    updateTitle();

  }
);


/* =====================================================
   モーダルの外側をタップして閉じる
===================================================== */

nameModal.addEventListener(
  "click",
  function(event) {

    if (
      event.target ===
      nameModal
    ) {

      closeNameEditor();

    }

  }
);


/* =====================================================
   最初に47マス表示
===================================================== */

createBoard();

</script>

</body>
</html>
