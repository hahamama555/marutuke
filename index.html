<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<title>企画ボード</title>

<style>

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  padding: 0;
  background: #ffffff;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Helvetica Neue",
    "Hiragino Kaku Gothic ProN",
    "Yu Gothic",
    Meiryo,
    sans-serif;

  color: #222;
}

body {
  padding-bottom: 70px;
}


/* ===============================
   全体
================================ */

.container {
  width: 100%;
  max-width: 1000px;

  margin: 0 auto;

  padding:
    8px 6px 70px;
}


/* ===============================
   企画切り替え
================================ */

.project-tabs {
  display: grid;

  grid-template-columns:
    repeat(2, 1fr);

  gap: 6px;

  margin-bottom: 10px;
}

.project-tab {
  min-height: 45px;

  border: none;

  border-radius: 9px;

  background: #dddddd;

  color: #333;

  font-size: 17px;

  font-weight: bold;

  cursor: pointer;
}

.project-tab.active {
  background: #2196f3;

  color: white;
}


/* ===============================
   タイトル
================================ */

#title {
  margin:
    5px 0 14px;

  text-align: center;

  font-size:
    clamp(22px, 6vw, 40px);

  font-weight: 800;

  line-height: 1.2;

  word-break: break-word;
}


/* ===============================
   設定
================================ */

.settings {
  background: #f3f3f3;

  border-radius: 13px;

  padding: 11px;

  margin-bottom: 12px;
}

.input-group {
  margin-bottom: 9px;
}

.input-group:last-child {
  margin-bottom: 0;
}

.input-group label {
  display: block;

  margin-bottom: 4px;

  font-size: 13px;

  font-weight: bold;
}

.input-group input {
  width: 100%;

  height: 42px;

  padding:
    7px 9px;

  border:
    2px solid #cccccc;

  border-radius: 8px;

  background: white;

  font-size: 16px;

  outline: none;
}

.input-group input:focus {
  border-color: #2196f3;
}


/* ===============================
   ボタン
================================ */

.button-row {
  display: grid;

  grid-template-columns:
    repeat(2, 1fr);

  gap: 6px;

  margin-top: 9px;
}

button {
  min-height: 43px;

  padding:
    8px;

  border: none;

  border-radius: 8px;

  color: white;

  font-size: 14px;

  font-weight: bold;

  cursor: pointer;

  touch-action: manipulation;
}

button:active {
  transform: scale(0.97);
}

.blue {
  background: #2196f3;
}

.green {
  background: #009688;
}

.red {
  background: #e53935;
}

.gray {
  background: #666666;
}


/* ===============================
   説明
================================ */

.help {
  text-align: center;

  color: #666;

  font-size: 12px;

  line-height: 1.4;

  margin:
    5px 0 10px;
}


/* ===============================
   マス
================================ */

#board {
  width: 100%;

  display: grid;

  grid-template-columns:
    repeat(5, minmax(0, 1fr));

  gap: 5px;
}


/* ===============================
   1マス
================================ */

.cell {
  position: relative;

  width: 100%;

  aspect-ratio: 1 / 1;

  background: #9edff0;

  border:
    2px solid #777;

  border-radius: 8px;

  display: flex;

  align-items: center;

  justify-content: center;

  overflow: hidden;

  cursor: pointer;

  user-select: none;

  -webkit-user-select: none;

  touch-action: manipulation;
}

.cell:active {
  transform: scale(0.96);
}


/* ===============================
   赤い⭕️
   文字より後ろ
================================ */

.cell-circle {
  position: absolute;

  z-index: 2;

  width: 88%;

  height: 88%;

  left: 6%;

  top: 6%;

  border:
    7px solid #ff0000;

  border-radius: 50%;

  display: none;

  pointer-events: none;
}

.cell.checked {
  background: #ffffff;
}

.cell.checked .cell-circle {
  display: block;
}


/* ===============================
   マス名称
   ⭕️より前
================================ */

.cell-name {
  position: relative;

  z-index: 5;

  width: 100%;

  padding:
    4px 2px;

  text-align: center;

  color: #222;

  font-size:
    clamp(10px, 3.4vw, 22px);

  font-weight: 800;

  line-height: 1.2;

  word-break: break-all;

  overflow-wrap: anywhere;

  pointer-events: none;
}


/* ===============================
   大量マス
================================ */

#board.large {
  gap: 3px;
}

#board.large .cell {
  border-width: 1px;

  border-radius: 5px;
}

#board.large .cell-name {
  font-size:
    clamp(7px, 2vw, 13px);
}

#board.large .cell-circle {
  border-width: 4px;
}


/* ===============================
   モーダル
================================ */

#nameModal {
  position: fixed;

  inset: 0;

  z-index: 1000;

  display: none;

  align-items: center;

  justify-content: center;

  padding: 12px;

  background:
    rgba(0,0,0,0.55);
}

#nameModal.show {
  display: flex;
}

.modal-box {
  width: 100%;

  max-width: 600px;

  max-height: 90vh;

  overflow-y: auto;

  background: white;

  border-radius: 15px;

  padding: 15px;
}

.modal-box h2 {
  margin:
    0 0 5px;

  font-size: 21px;
}

.modal-box p {
  margin:
    0 0 10px;

  color: #666;

  font-size: 13px;

  line-height: 1.4;
}


/* ===============================
   名称入力
================================ */

.name-list {
  display: flex;

  flex-direction: column;

  gap: 6px;
}

.name-row {
  display: flex;

  align-items: center;

  gap: 6px;
}

.name-number {
  width: 34px;

  flex: 0 0 34px;

  text-align: right;

  color: #555;

  font-size: 12px;

  font-weight: bold;
}

.name-row input {
  flex: 1;

  min-width: 0;

  height: 40px;

  padding:
    6px 8px;

  border:
    1px solid #ccc;

  border-radius: 7px;

  font-size: 15px;

  outline: none;
}


/* ===============================
   モーダルボタン
================================ */

.modal-buttons {
  display: grid;

  grid-template-columns:
    repeat(2, 1fr);

  gap: 6px;

  margin-top: 10px;
}


/* ===============================
   スマホ
================================ */

@media (max-width: 600px) {

  .container {
    padding:
      5px 4px 70px;
  }

  #board {
    gap: 4px;
  }

  .cell {
    border-width: 2px;

    border-radius: 7px;
  }

  .cell-circle {
    border-width: 5px;
  }

  .cell-name {
    font-size:
      clamp(9px, 3.5vw, 18px);
  }
}


/* ===============================
   1〜4マス
================================ */

#board.one {
  grid-template-columns:
    repeat(1, 1fr);
}

#board.two {
  grid-template-columns:
    repeat(2, 1fr);
}

#board.three {
  grid-template-columns:
    repeat(3, 1fr);
}

#board.four {
  grid-template-columns:
    repeat(4, 1fr);
}

</style>
</head>


<body>

<div class="container">


<!-- ==================================
     企画切り替え
=================================== -->

<div class="project-tabs">

  <button
    id="tab1"
    class="project-tab active">
    企画①
  </button>

  <button
    id="tab2"
    class="project-tab">
    企画②
  </button>

</div>


<!-- ==================================
     タイトル
=================================== -->

<h1 id="title">
  47都道府県制覇！
</h1>


<!-- ==================================
     設定
=================================== -->

<div class="settings">

  <div class="input-group">

    <label>
      タイトル
    </label>

    <input
      id="titleInput"
      type="text">

  </div>


  <div class="input-group">

    <label>
      マス数（1〜200）
    </label>

    <input
      id="countInput"
      type="number"
      min="1"
      max="200">

  </div>


  <div class="button-row">

    <button
      id="createButton"
      class="blue">
      マスを作る
    </button>

    <button
      id="nameButton"
      class="green">
      マス名称を設定
    </button>

    <button
      id="resetButton"
      class="red">
      ⭕️を全部リセット
    </button>

  </div>

</div>


<!-- ==================================
     説明
=================================== -->

<div class="help">

  マスをタップすると
  <strong>白色＋赤い⭕️</strong>になります。<br>

  企画①と企画②は別々に保存されます。

</div>


<!-- ==================================
     ボード
=================================== -->

<div id="board"></div>


</div>


<!-- ==================================
     名称設定モーダル
=================================== -->

<div id="nameModal">

  <div class="modal-box">

    <h2>
      マス名称を設定
    </h2>

    <p>
      好きな名前を入力してください。<br>
      1つの入力欄が1マスです。
    </p>


    <div
      id="nameList"
      class="name-list">
    </div>


    <div class="modal-buttons">

      <button
        id="cancelButton"
        class="gray">
        キャンセル
      </button>

      <button
        id="saveNamesButton"
        class="blue">
        名称を保存
      </button>

    </div>

  </div>

</div>


<script>

/* =================================================
   47都道府県
================================================= */

const defaultNames = [

  "北海道",
  "青森県",
  "岩手県",
  "宮城県",
  "秋田県",
  "山形県",
  "福島県",

  "茨城県",
  "栃木県",
  "群馬県",
  "埼玉県",
  "千葉県",
  "東京都",
  "神奈川県",

  "新潟県",
  "富山県",
  "石川県",
  "福井県",
  "山梨県",
  "長野県",

  "岐阜県",
  "静岡県",
  "愛知県",
  "三重県",

  "滋賀県",
  "京都府",
  "大阪府",
  "兵庫県",
  "奈良県",
  "和歌山県",

  "鳥取県",
  "島根県",
  "岡山県",
  "広島県",
  "山口県",

  "徳島県",
  "香川県",
  "愛媛県",
  "高知県",

  "福岡県",
  "佐賀県",
  "長崎県",
  "熊本県",
  "大分県",
  "宮崎県",
  "鹿児島県",
  "沖縄県"

];


/* =================================================
   企画データ
================================================= */

const defaultProject1 = {

  title:
    "47都道府県制覇！",

  count:
    47,

  names:
    [...defaultNames],

  checked:
    []

};


const defaultProject2 = {

  title:
    "企画②",

  count:
    25,

  names:
    Array.from(
      { length: 25 },
      (_, i) =>
        "マス" + (i + 1)
    ),

  checked:
    []

};


/* =================================================
   現在の企画
================================================= */

let currentProject = 1;


/* =================================================
   企画データ
================================================= */

let project1 =
  loadProject(
    "tiktokProject1",
    defaultProject1
  );


let project2 =
  loadProject(
    "tiktokProject2",
    defaultProject2
  );


/* =================================================
   現在のデータを取得
================================================= */

function getCurrentProject() {

  if (
    currentProject === 1
  ) {

    return project1;

  }

  return project2;

}


/* =================================================
   保存
================================================= */

function saveProjects() {

  localStorage.setItem(
    "tiktokProject1",
    JSON.stringify(project1)
  );

  localStorage.setItem(
    "tiktokProject2",
    JSON.stringify(project2)
  );

}


/* =================================================
   読み込み
================================================= */

function loadProject(
  key,
  defaultData
) {

  try {

    const saved =
      localStorage.getItem(key);

    if (
      saved
    ) {

      const data =
        JSON.parse(saved);

      return {

        title:
          data.title ||
          defaultData.title,

        count:
          data.count ||
          defaultData.count,

        names:
          Array.isArray(data.names)
            ? data.names
            : [...defaultData.names],

        checked:
          Array.isArray(data.checked)
            ? data.checked
            : []

      };

    }

  } catch (e) {

    console.log(
      "読み込みエラー",
      e
    );

  }


  return {

    title:
      defaultData.title,

    count:
      defaultData.count,

    names:
      [...defaultData.names],

    checked:
      []

  };

}


/* =================================================
   画面の要素
================================================= */

const title =
  document.getElementById(
    "title"
  );

const titleInput =
  document.getElementById(
    "titleInput"
  );

const countInput =
  document.getElementById(
    "countInput"
  );

const board =
  document.getElementById(
    "board"
  );

const tab1 =
  document.getElementById(
    "tab1"
  );

const tab2 =
  document.getElementById(
    "tab2"
  );

const nameModal =
  document.getElementById(
    "nameModal"
  );

const nameList =
  document.getElementById(
    "nameList"
  );


/* =================================================
   画面表示
================================================= */

function render() {

  const data =
    getCurrentProject();


  /* タイトル */

  title.textContent =
    data.title;

  titleInput.value =
    data.title;


  /* マス数 */

  countInput.value =
    data.count;


  /* タブ */

  tab1.classList.toggle(
    "active",
    currentProject === 1
  );

  tab2.classList.toggle(
    "active",
    currentProject === 2
  );


  /* ボード */

  renderBoard(
    data
  );

}


/* =================================================
   マス表示
================================================= */

function renderBoard(
  data
) {

  board.innerHTML =
    "";


  board.className =
    "";


  /* 列数 */

  if (
    data.count === 1
  ) {

    board.classList.add(
      "one"
    );

  }

  else if (
    data.count === 2
  ) {

    board.classList.add(
      "two"
    );

  }

  else if (
    data.count === 3
  ) {

    board.classList.add(
      "three"
    );

  }

  else if (
    data.count === 4
  ) {

    board.classList.add(
      "four"
    );

  }

  else if (
    data.count >= 100
  ) {

    board.classList.add(
      "large"
    );

  }


  /* マス生成 */

  for (
    let i = 0;
    i < data.count;
    i++
  ) {

    const cell =
      document.createElement(
        "div"
      );

    cell.className =
      "cell";


    /* チェック状態 */

    if (
      data.checked.includes(i)
    ) {

      cell.classList.add(
        "checked"
      );

    }


    /* ⭕️ */

    const circle =
      document.createElement(
        "div"
      );

    circle.className =
      "cell-circle";


    /* 名称 */

    const name =
      document.createElement(
        "div"
      );

    name.className =
      "cell-name";

    name.textContent =
      data.names[i] ||
      "マス" +
      (i + 1);


    /*
      ⭕️を先に追加
      文字を後に追加

      さらにz-indexで
      文字を前面にする
    */

    cell.appendChild(
      circle
    );

    cell.appendChild(
      name
    );


    /* タップ */

    cell.addEventListener(
      "click",
      function() {

        const current =
          getCurrentProject();


        const position =
          current.checked.indexOf(i);


        if (
          position === -1
        ) {

          current.checked.push(i);

        }

        else {

          current.checked.splice(
            position,
            1
          );

        }


        saveProjects();

        renderBoard(
          current
        );

      }
    );


    board.appendChild(
      cell
    );

  }

}


/* =================================================
   企画切り替え
================================================= */

function switchProject(
  number
) {

  /* 現在の設定を保存 */

  saveCurrentInputs();


  currentProject =
    number;


  render();

}


/* =================================================
   現在の入力内容を保存
================================================= */

function saveCurrentInputs() {

  const data =
    getCurrentProject();


  /* タイトル */

  const newTitle =
    titleInput.value.trim();


  data.title =
    newTitle ||
    "企画";


  /* マス数 */

  let newCount =
    parseInt(
      countInput.value,
      10
    );


  if (
    isNaN(newCount)
  ) {

    newCount = 1;

  }


  if (
    newCount < 1
  ) {

    newCount = 1;

  }


  if (
    newCount > 200
  ) {

    newCount = 200;

  }


  data.count =
    newCount;


  /* 名称不足分を追加 */

  while (
    data.names.length <
    newCount
  ) {

    data.names.push(
      "マス" +
      (
        data.names.length +
        1
      )
    );

  }


  /* 不要な⭕️を削除 */

  data.checked =
    data.checked.filter(
      index =>
        index < newCount
    );


  saveProjects();

}


/* =================================================
   マスを作る
================================================= */

function createBoard() {

  saveCurrentInputs();

  render();

}


/* =================================================
   名称設定を開く
================================================= */

function openNameEditor() {

  const data =
    getCurrentProject();


  nameList.innerHTML =
    "";


  for (
    let i = 0;
    i < data.count;
    i++
  ) {

    const row =
      document.createElement(
        "div"
      );

    row.className =
      "name-row";


    /* 番号 */

    const number =
      document.createElement(
        "div"
      );

    number.className =
      "name-number";

    number.textContent =
      (
        i + 1
      ) +
      "．";


    /* 入力欄 */

    const input =
      document.createElement(
        "input"
      );

    input.type =
      "text";

    input.value =
      data.names[i] ||
      "マス" +
      (
        i + 1
      );

    input.dataset.index =
      i;


    row.appendChild(
      number
    );

    row.appendChild(
      input
    );

    nameList.appendChild(
      row
    );

  }


  nameModal.classList.add(
    "show"
  );

}


/* =================================================
   名称保存
================================================= */

function saveNames() {

  const data =
    getCurrentProject();


  const inputs =
    nameList.querySelectorAll(
      "input"
    );


  inputs.forEach(
    function(input) {

      const index =
        parseInt(
          input.dataset.index,
          10
        );


      const value =
        input.value.trim();


      data.names[index] =
        value ||
        "マス" +
        (
          index + 1
        );

    }
  );


  saveProjects();


  closeNameEditor();


  render();

}


/* =================================================
   モーダルを閉じる
================================================= */

function closeNameEditor() {

  nameModal.classList.remove(
    "show"
  );

}


/* =================================================
   ⭕️リセット
================================================= */

function resetChecked() {

  const ok =
    confirm(
      "現在の企画の⭕️を全部消しますか？"
    );


  if (
    !ok
  ) {

    return;

  }


  const data =
    getCurrentProject();


  data.checked =
    [];


  saveProjects();


  render();

}


/* =================================================
   タイトル入力
================================================= */

titleInput.addEventListener(
  "input",
  function() {

    const data =
      getCurrentProject();


    data.title =
      titleInput.value;


    title.textContent =
      titleInput.value;


    saveProjects();

  }
);


/* =================================================
   マス数変更
================================================= */

countInput.addEventListener(
  "change",
  function() {

    createBoard();

  }
);


/* =================================================
   企画①
================================================= */

tab1.addEventListener(
  "click",
  function() {

    switchProject(1);

  }
);


/* =================================================
   企画②
================================================= */

tab2.addEventListener(
  "click",
  function() {

    switchProject(2);

  }
);


/* =================================================
   マスを作る
================================================= */

document
  .getElementById(
    "createButton"
  )
  .addEventListener(
    "click",
    function() {

      createBoard();

    }
  );


/* =================================================
   名称設定
================================================= */

document
  .getElementById(
    "nameButton"
  )
  .addEventListener(
    "click",
    function() {

      openNameEditor();

    }
  );


/* =================================================
   名称保存
================================================= */

document
  .getElementById(
    "saveNamesButton"
  )
  .addEventListener(
    "click",
    function() {

      saveNames();

    }
  );


/* =================================================
   キャンセル
================================================= */

document
  .getElementById(
    "cancelButton"
  )
  .addEventListener(
    "click",
    function() {

      closeNameEditor();

    }
  );


/* =================================================
   ⭕️リセット
================================================= */

document
  .getElementById(
    "resetButton"
  )
  .addEventListener(
    "click",
    function() {

      resetChecked();

    }
  );


/* =================================================
   モーダル外タップ
================================================= */

nameModal.addEventListener(
  "click",
  function(event) {

    if (
      event.target ===
      nameModal
    ) {

      closeNameEditor();

    }

  }
);


/* =================================================
   最初の表示
================================================= */

render();

</script>

</body>
</html>
